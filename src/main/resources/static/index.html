<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Java Cloud Platform Lab - Task Board</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="page">
    <header class="page-header">
        <img class="project-logo" src="/assets/logo.svg" alt="">
        <div class="page-heading">
            <p class="eyebrow">Java Cloud Platform Lab</p>
            <h1>Task Board</h1>
            <p class="intro">
                A focused browser UI for the Spring Boot task API.
            </p>
        </div>

        <fieldset class="theme-selector">
            <legend class="visually-hidden">Theme</legend>
            <div class="theme-options">
                <label title="Light">
                    <input type="radio" name="theme-preference" value="light">
                    <span class="theme-choice">
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <circle cx="12" cy="12" r="4"></circle>
                            <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
                        </svg>
                        <span class="visually-hidden">Light</span>
                    </span>
                </label>
                <label title="Dark">
                    <input type="radio" name="theme-preference" value="dark">
                    <span class="theme-choice">
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5a8.5 8.5 0 1 0 10.8 10.8Z"></path>
                        </svg>
                        <span class="visually-hidden">Dark</span>
                    </span>
                </label>
                <label title="System">
                    <input type="radio" name="theme-preference" value="system">
                    <span class="theme-choice">
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <rect x="3" y="4" width="18" height="14" rx="2"></rect>
                            <path d="M8 22h8M12 18v4"></path>
                        </svg>
                        <span class="visually-hidden">System</span>
                    </span>
                </label>
            </div>
        </fieldset>
    </header>

    <section class="summary" aria-label="Task summary">
        <article>
            <span>Total</span>
            <strong id="total-count">0</strong>
        </article>
        <article>
            <span>Open</span>
            <strong id="open-count">0</strong>
        </article>
        <article>
            <span>Completed</span>
            <strong id="completed-count">0</strong>
        </article>
    </section>

    <section class="panel" aria-labelledby="create-task-heading">
        <div class="panel-header">
            <div>
                <h2 id="create-task-heading">Create task</h2>
                <p>Add a task through the REST API.</p>
            </div>
        </div>

        <form id="task-form" class="task-form">
            <label for="task-title">Task title</label>
            <div class="form-row">
                <input
                        id="task-title"
                        name="title"
                        type="text"
                        placeholder="Example: Review Kubernetes manifests"
                        autocomplete="off"
                        required>
                <button type="submit" disabled>Add task</button>
            </div>
        </form>

        <p id="status-message" class="status-message" aria-live="polite"></p>
    </section>

    <section class="panel" aria-labelledby="task-list-heading">
        <div class="panel-header task-list-header">
            <div>
                <h2 id="task-list-heading">Tasks</h2>
                <p>Update, complete, or delete existing tasks.</p>
            </div>

            <button id="refresh-button" class="secondary-button" type="button">Refresh</button>
        </div>

        <div id="empty-state" class="empty-state">
            <strong>No tasks yet.</strong>
            <span>Create a task above to start the demo.</span>
        </div>

        <ul id="task-list" class="task-list"></ul>
    </section>
</main>

<script src="/app.js"></script>
</body>
</html>
